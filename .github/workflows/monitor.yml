name: Monitor diario de precios
on:
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python monitor.py
	      - name: Verificar conexion configurada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          url = os.getenv("DATABASE_URL", "").strip()
          print("Secreto presente:", bool(url))
          print("Formato PostgreSQL:", url.startswith(("postgresql://", "postgres://")))
          if not url.startswith(("postgresql://", "postgres://")):
              raise SystemExit("ERROR: DATABASE_URL no tiene formato PostgreSQL")
          PY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_THRESHOLD_PERCENT: '5'
          MIN_DISPROLIM_PRODUCTS: '100'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
